name: Purge orphaned media (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "فقط شمارش، بدون حذف واقعی"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/purge_orphaned_media.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
