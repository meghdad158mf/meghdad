name: Cleanup old post media

on:
  schedule:
    # روزی ۲ بار (هر ۱۲ ساعت) — هماهنگ با RETENTION_DAYS=0.5 (۱۲ ساعت).
    # وقتی این جاب فقط یه‌بار در روز اجرا می‌شد ولی RETENTION_DAYS به نیم
    # روز کم شده بود، بین دو اجرا رسانه تا نزدیک ۳۶ ساعت جمع می‌شد (نه ۱۲
    # ساعت) و باعث رد شدن از سقف ۱ گیگ Storage شد — این تغییر برای رفعشه.
    #
    # ⚠️ عمداً دو ورودی جدای «- cron» (نه یه ورودی با «3,15» ترکیبی): با
    # بررسی تاریخچه‌ی واقعی اجراها معلوم شد وقتی هر دو ساعت توی یه رشته‌ی
    # cron ترکیب می‌شن، GitHub Actions در عمل فقط یکی از دو اسلات رو در
    # روز اجرا می‌کنه (نه هر دو) — نتیجه‌ش فاصله‌ی واقعی ~۲۴ ساعته به‌جای
    # ۱۲ ساعت بود و Storage دوباره داشت بالا می‌رفت. دو ورودی جدا همون یه
    # فایل/ورک‌فلوئه (نه فایل جدید)، ولی هرکدوم trigger مستقل خودش رو داره.
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:       # امکان اجرای دستی از تب Actions
    inputs:
      retention_days_override:
        description: "پاک‌سازی فوری: عدد روز جایگزین (مثلاً 0.02 ~ نیم ساعت) فقط برای همین یه اجرا — RETENTION_DAYS دائمی توی کد دست‌نخورده می‌مونه. خالی بذار برای رفتار عادی."
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/cleanup_media.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RETENTION_DAYS_OVERRIDE: ${{ github.event.inputs.retention_days_override }}
